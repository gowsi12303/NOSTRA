# Render Blueprint for NOSTRA — https://render.com/docs/blueprint-spec
#
#   nostra-api           Django REST API (Gunicorn)        -> nostra-db
#   nostra-web           React/Vite storefront (static site)
#   nostra-db            Render Postgres
#
# No secret or URL is written in this file:
#   generateValue: true   Render creates a random value once and keeps it.
#   fromDatabase          Render injects the database's connection string.
#   sync: false           Render asks for the value when the Blueprint is
#                         first created; change it later in the Dashboard.
#
# Everything below runs on Render's FREE plans, which has consequences:
#   - preDeployCommand is not available, so migrations run in the build.
#   - Cron jobs are not available, so expired JWT blacklist rows are not
#     cleaned up automatically; run `python manage.py flushexpiredtokens`
#     by hand when needed.
#   - The free Postgres database expires after 30 days.
#   - The free web service sleeps when idle and is slow to wake.

databases:
  - name: nostra-db
    plan: free
    region: singapore
    databaseName: nostra
    user: nostra

services:
  # --- Backend ---------------------------------------------------------
  - type: web
    name: nostra-api
    runtime: python
    plan: free
    region: singapore
    # Dependencies and static files are part of the build artifact.
    # Migrations run last, before the new version receives traffic; a
    # failure fails the build and the old version keeps serving.
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    # Render supplies the bind address through GUNICORN_CMD_ARGS and the
    # worker count through WEB_CONCURRENCY.
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: nostra-db
          property: connectionString
      - key: CONN_MAX_AGE
        value: "60"
      # The service's own onrender.com host is trusted automatically (see
      # RENDER_EXTERNAL_HOSTNAME in config/settings.py). ALLOWED_HOSTS and
      # CSRF_TRUSTED_ORIGINS are only needed for custom domains — add them
      # in the Dashboard if one is attached.
      #
      # Origin of the deployed frontend (nostra-web), e.g. its
      # https://<name>.onrender.com URL. Comma-separate several.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Render terminates TLS at its load balancer and forwards plain HTTP
      # with X-Forwarded-Proto.
      - key: USE_PROXY_SSL_HEADER
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      # One hour to start with; raise once HTTPS is confirmed working.
      - key: SECURE_HSTS_SECONDS
        value: "3600"
      - key: DRF_BROWSABLE_API
        value: "False"
      - key: LOG_LEVEL
        value: INFO
      # Product images: the service's disk is wiped on every deploy, so
      # uploads must go to an S3-compatible bucket. No provider is chosen
      # yet, so every value is entered by hand. Leave them ALL blank until
      # a bucket exists (uploads then land on the temporary disk and are
      # lost on the next deploy). Once it does, set MEDIA_STORAGE_BACKEND
      # to storages.backends.s3.S3Storage and fill in the S3_* values;
      # S3_ENDPOINT_URL is for non-AWS providers, S3_REGION_NAME optional.
      - key: MEDIA_STORAGE_BACKEND
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION_NAME
        sync: false

  # --- Frontend --------------------------------------------------------
  - type: web
    name: nostra-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    # Client-side routing: any path that is not a real file serves the app.
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      # Public HTTPS origin of nostra-api, e.g. its
      # https://<name>.onrender.com URL. Baked into the JavaScript at
      # build time — it is not a secret, and changing it needs a redeploy.
      - key: VITE_API_BASE_URL
        sync: false
          